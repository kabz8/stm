kind = "web"
previewPath = "/"
title = "Solartech Merchants"
version = "1.0.0"
id = "artifacts/solartech-merchants"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25147

[services.development]
run = "pnpm --filter @workspace/solartech-merchants run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solartech-merchants", "run", "build" ]
publicDir = "artifacts/solartech-merchants/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25147"
BASE_PATH = "/"
